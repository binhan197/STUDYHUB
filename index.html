/* Study Hub UX: consistent open/close navigation on desktops, phones and iPads */

function videoEmbedConfig(r){
 const raw=r.embedUrl||r.url;
 const yt=youtubeId(raw);
 if(yt&&/^[A-Za-z0-9_-]{11}$/.test(yt)){
  let start=0;
  try{
   const u=new URL(raw);
   const val=u.searchParams.get('t')||u.searchParams.get('start')||'';
   if(/^\d+s?$/.test(val))start=parseInt(val,10);
   else if(/^\d+m\d+s?$/.test(val)){const m=val.match(/^(\d+)m(\d+)/);start=60*Number(m[1])+Number(m[2]);}
  }catch(e){}
  const params='?playsinline=1&controls=1&rel=0'+(start?'&start='+start:'');
  return {kind:'youtube',src:'https://www.youtube-nocookie.com/embed/'+yt+params};
 }
 // Exact YouTube originals verified for matching Khan Academy lessons.
 // The public Khan Academy link is still retained as the original resource.
 try{
  const ku=new URL(raw);
  if((ku.hostname==='khanacademy.org'||ku.hostname.endsWith('.khanacademy.org'))&&ku.pathname.includes('/v/')){
   const slug=ku.pathname.split('/v/').pop().split('/')[0];
   const known={
    'neuron-resting-potential-description':'4htSVI5E9AQ',
    'neuron-resting-potential-mechanism':'l3ngsl7FhTc',
    'neuron-graded-potential-description':'AQr0rNyUnFM',
    'neuron-action-potential-description':'h2H6POZowiU',
    'neuron-action-potential-mechanism':'MZz4OUOyFvg',
    'anatomy-of-a-muscle-cell-1':'uY2ZOsCnXIA',
    'saltatory-conduction-in-neurons':'ikFUv-gdNLQ'
   };
   if(known[slug])return {kind:'youtube',src:'https://www.youtube-nocookie.com/embed/'+known[slug]+'?playsinline=1&controls=1&rel=0'};
  }
 }catch(e){}
 // Some Khan Academy video pages offer an embedded player, but the provider
 // may decline cross-site framing. In that case retain a clearly labeled source link.
 try{
  const u=new URL(raw);
  if((u.hostname==='khanacademy.org'||u.hostname.endsWith('.khanacademy.org'))&&u.pathname.includes('/v/')){
   return {kind:'khan',src:u.href};
  }
 }catch(e){}
 return null;
}

 const fallback=config?.kind==='khan'?'Khan Academy may restrict playback inside other websites. If the video does not display, use the original source link.':config?.kind==='youtube'?'Play directly above. If this publisher restricts embedding, open the original video instead.':'This resource is available from its original provider.';
 const notes=`<details class="lesson-notes-collapse" id="lessonNotes"><summary>✎ Study notes ${r.notes?.trim()?'· saved':''}</summary><div class="notes-content"><label for="noteInput">Personal notes</label><textarea id="noteInput" rows="6" placeholder="Key ideas, formulas, questions…">${h(r.notes||'')}</textarea><small>Saved on this device. Backup is available in ⋯ Tools.</small></div></details>`;
 const body=`<div class="lesson-detail video-first-detail">${playArea}<div class="detail-player-tip">${h(fallback)}</div><div class="detail-actions video-quick-actions"><button type="button" class="btn" data-action="toggle-done-detail" data-id="${h(r.id)}">${r.done?'✓ Completed':'○ Mark completed'}</button><button type="button" class="btn" data-action="toggle-star-detail" data-id="${h(r.id)}">${r.star?'★ Bookmarked':'☆ Bookmark'}</button><a class="btn source-link" href="${h(urlOk(r.url))}" target="_blank" rel="noopener noreferrer">↗ Original source (if needed)</a></div><details class="lesson-info-collapse"><summary>About this lesson</summary><div class="lesson-about"><div class="detail-meta">${pill(r.provider||'Custom')}${pill(r.type||'resource')}${pill(x.f.title)}</div><p class="detail-desc">${h(r.description||'No description yet.')}</p></div></details>${notes}<div class="detail-edit"><span>Location: ${h(x.c.name)} / ${h(x.f.title)}</span><div class="detail-actions"><button type="button" class="btn sm" data-action="edit-resource" data-id="${h(id)}">Edit / move</button><button type="button" class="btn sm danger" data-action="delete-resource" data-id="${h(id)}">Delete</button></div></div></div>`;
 openDialog('detail',shell(r.title,x.c.name,body));
}
function parseLinks(raw){const list=[];for(const line of raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)){let title='',url='';if(line.includes('|')){const bits=line.split('|');title=bits.slice(0,-1).join('|').trim();url=bits.at(-1).trim();}else url=line;const clean=urlOk(url);if(!clean)throw Error('Invalid link: '+line.slice(0,90));list.push({id:uid('r'),title:title||guessTitle(clean),url:clean,description:'',type:'video',provider:resourceProvider(clean),done:false,star:false,notes:''});}if(list.length>200)throw Error('Maximum 200 links at once');return list;}
function formSubmit(form){const fd=new FormData(form),v=x=>String(fd.get(x)||'').trim(),mode=form.dataset.kind,id=form.dataset.id,err=form.querySelector('#formError');err.textContent='';try{
if(mode==='course') {if(!v('name'))throw Error('Course name is required');if(v('driveUrl')&&!urlOk(v('driveUrl')))throw Error('Invalid course link');const c=id?findCourse(id):{id:uid('c'),folders:[]};if(!id)data.courses.push(c);Object.assign(c,{name:v('name'),description:v('description'),driveUrl:v('driveUrl')});selected=c.id;}
if(mode==='folder'){if(!v('title'))throw Error('Folder name is required');const c=findCourse(form.dataset.course),parentId=v('parent'),newResources=parseLinks(v('links'));if(!c)throw Error('Course not found');let f,sourceArray;if(id){const x=folderContext(id);if(!x)throw Error('Folder not found');if(descIds(x.f).includes(parentId))throw Error('A folder cannot be placed inside itself');f=x.f;sourceArray=x.parent?x.parent.folders:x.c.folders;}else f={id:uid('f'),title:'',goal:'',level:'core',folders:[],resources:[]};const target=parentId==='root'?c.folders:folderContext(parentId)?.f.folders;if(!target)throw Error('Destination folder not found');if(id&&sourceArray!==target)sourceArray.splice(sourceArray.indexOf(f),1);if(!id||sourceArray!==target)target.push(f);Object.assign(f,{title:v('title'),goal:v('goal'),level:v('level')});f.resources.push(...newResources);collapsed.delete(f.id);if(parentId!=='root')collapsed.delete(parentId);activeFolder=f.id;}
if(mode==='resource'){const clean=urlOk(v('url'));if(!clean)throw Error('Enter a full http(s) link');const embedLink=v('embedUrl');const embedUrl=embedLink?urlOk(embedLink):'';if(embedLink&&(!embedUrl||!youtubeId(embedUrl)))throw Error('Direct playback URL must be a valid YouTube video link');const dst=folderContext(v('folder'));if(!dst)throw Error('Choose a destination folder');const r=id?itemContext(id)?.r:{id:uid('r'),done:false,star:false,notes:''};if(!r)throw Error('Resource not found');if(id){const old=itemContext(id);old.f.resources.splice(old.f.resources.indexOf(r),1)}dst.f.resources.push(r);Object.assign(r,{url:clean,embedUrl,title:v('title')||guessTitle(clean),provider:v('provider')||resourceProvider(clean),type:v('type')||'video',description:v('description')});selected=dst.c.id;activeFolder=dst.f.id;collapsed.delete(dst.f.id);}
closeDialog(el.edit);updated(mode==='folder'?'Folder and links saved':'Learning library saved');}catch(e){err.textContent=e.message}}
function mutateOrder(list,obj,step,label){const pos=list.indexOf(obj),next=pos+step;if(pos<0||next<0||next>=list.length)return;[list[pos],list[next]]=[list[next],list[pos]];updated(label+' order updated')}
function deleteFolder(id){const x=folderContext(id);if(!x)return;const n=getNestedResources(x.f).length;if(!confirm(`Delete folder “${x.f.title}”, ${n} resource(s), all its subfolders and saved notes? This cannot be undone. Export a backup first if needed.`))return;const target=x.parent?x.parent.folders:x.c.folders;target.splice(target.indexOf(x.f),1);updated('Folder deleted')}
function deleteResource(id){const x=itemContext(id);if(!x)return;if(!confirm(`Delete “${x.r.title}” and its notes?`))return;x.f.resources.splice(x.f.resources.indexOf(x.r),1);closeDialog(el.detail);updated('Resource deleted')}
function download(name,str){const blob=new Blob([str],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200)}
function exportData(){download('Study_Hub_Backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'Study Hub',schemaVersion:2,exportedAt:new Date().toISOString(),library:data,collapsedFolders:[...collapsed]},null,2));notify('JSON backup downloaded')}
function importData(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result),candidate=toV2(parsed.library||parsed);if(!validate(candidate))throw Error('File does not contain a valid library');if(!confirm('Replace all courses, progress and notes with the selected backup? Export your current backup first.'))return;data=candidate;collapsed=new Set(Array.isArray(parsed.collapsedFolders)?parsed.collapsedFolders:[]);selected=data.courses[0]?.id||null;activeFolder=null;search='';filter='all';kind='all';updated('Backup restored');}catch(e){notify('Import failed: '+e.message,true)}};reader.onerror=()=>notify('Unable to read file',true);reader.readAsText(file)}
function toggleFolder(id){collapsed.has(id)?collapsed.delete(id):collapsed.add(id);try{localStorage.setItem(FOLD_KEY,JSON.stringify([...collapsed]))}catch(e){}render()}
function closeNavDrawer(){el.side.classList.remove('show');document.getElementById('sidebarBackdrop').classList.remove('show');document.querySelectorAll('[data-action="toggle-sidebar"]').forEach(b=>b.setAttribute('aria-expanded','false'))}
function toggleNavPanel(){
 if(window.matchMedia('(max-width:760px)').matches){
  const isOpen=el.side.classList.toggle('show');
  document.getElementById('sidebarBackdrop').classList.toggle('show',isOpen);
  document.querySelectorAll('[data-action="toggle-sidebar"]').forEach(b=>b.setAttribute('aria-expanded',String(isOpen)));
 }else{
  const isCollapsed=document.querySelector('.app').classList.toggle('sidebar-collapsed');
  el.side.classList.remove('show');
  document.getElementById('sidebarBackdrop').classList.remove('show');
  document.querySelectorAll('[data-action="toggle-sidebar"]').forEach(b=>b.setAttribute('aria-expanded',String(!isCollapsed)));
 }
}
function selectFolder(id){const x=folderContext(id);if(!x)return;selected=x.c.id;activeFolder=id;collapsed.delete(id);for(const parent of x.ancestors)collapsed.delete(parent.id);persist();render();document.getElementById('folder-'+id)?.scrollIntoView({behavior:'smooth',block:'start'});closeNavDrawer()}
function action(target){const a=target.dataset.action,id=target.dataset.id,step=Number(target.dataset.step||0);if(!a)return;
switch(a){case 'install-guide':showInstallGuide();break;case 'library-tools':showLibraryTools();break;case 'select-course':selected=id;activeFolder=null;search='';filter='all';kind='all';render();window.scrollTo({top:0,behavior:'smooth'});closeNavDrawer();break;
case 'jump-folder':selectFolder(id);break;case 'toggle-folder':toggleFolder(id);break;
case 'toggle-sidebar':toggleNavPanel();break;case 'close-sidebar':if(window.matchMedia('(max-width:760px)').matches)closeNavDrawer();else toggleNavPanel();break;
case 'new-course':editCourse(null);break;case 'edit-course':closeNavDrawer();editCourse(id);break;
case 'delete-course':{const c=findCourse(id);if(c&&confirm(`Delete the entire course “${c.name}”, its folders, ${allResources(c).length} resources, notes and progress? Export a backup first. This cannot be undone.`)){data.courses.splice(data.courses.indexOf(c),1);selected=data.courses[0]?.id||null;activeFolder=null;updated('Course deleted')}break;}
case 'new-folder':editFolder(null,target.dataset.parent||'root');break;case 'edit-folder':closeNavDrawer();editFolder(id);break;case 'new-resource':editResource(null,target.dataset.folder||null);break;case 'edit-resource':closeNavDrawer();closeDialog(el.detail);editResource(id);break;
case 'toggle-done':case 'toggle-done-detail':{const x=itemContext(id);if(x){x.r.done=!x.r.done;persist();render();if(a.endsWith('detail')){target.textContent=x.r.done?'✓ Completed':'○ Mark completed';} }break}
case 'toggle-star':case 'toggle-star-detail':{const x=itemContext(id);if(x){x.r.star=!x.r.star;persist();render();if(a.endsWith('detail')){target.textContent=x.r.star?'★ Bookmarked':'☆ Bookmark';}}break}
case 'detail':closeNavDrawer();showResource(id);break;
case 'delete-folder':deleteFolder(id);break;case 'delete-resource':deleteResource(id);break;
case 'move-resource':{const x=itemContext(id);if(x)mutateOrder(x.f.resources,x.r,step,'Video');break}
case 'move-folder':{const x=folderContext(id);if(x)mutateOrder(x.parent?x.parent.folders:x.c.folders,x.f,step,'Folder');break}
case 'move-course':{const c=findCourse(id);if(c)mutateOrder(data.courses,c,step,'Course');break}
case 'expand-all':collapsed.clear();persist();render();break;
case 'collapse-all':{const c=findCourse(selected);if(c)walkFolders(c,f=>collapsed.add(f.id));persist();render();break}
case 'export':exportData();break;case 'import':el.importer.click();break;
case 'reset':if(confirm('Replace all local data with the 36-lesson starter library? This deletes your custom folders, courses, notes, and progress. Export a backup first.')){data=clone(SEED);selected=data.courses[0]?.id||null;collapsed.clear();walkFolders(data.courses[0],(f,p,d)=>{if(d>=2)collapsed.add(f.id)});updated('Starter library restored')}break;
case 'embed':{const x=itemContext(id),cfg=x&&videoEmbedConfig(x.r),host=el.detail.querySelector('#embedHere');if(!cfg||!host)return;host.innerHTML=`<iframe title="${h(x.r.title)}" src="${h(cfg.src)}" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;break}
case 'close-dialog':closeDialog(target.closest('dialog'));break;
}}
function events(){document.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(t)action(t)});document.getElementById('sidebarBackdrop').addEventListener('click',()=>closeNavDrawer());
for(const d of [el.detail,el.edit,el.install])d.addEventListener('click',e=>{if(e.target===d)closeDialog(d)});
document.addEventListener('submit',e=>{if(e.target.id==='editorForm'){e.preventDefault();formSubmit(e.target)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){const cursor=e.target.selectionStart;search=e.target.value;render();const s=document.getElementById('search');s.focus();s.setSelectionRange(cursor,cursor)}else if(e.target.id==='noteInput'&&currentDetail){const x=itemContext(currentDetail);if(x){x.r.notes=e.target.value;persist()}}});
document.addEventListener('change',e=>{if(e.target.id==='statusFilter'){filter=e.target.value;render()}if(e.target.id==='typeFilter'){kind=e.target.value;render()}if(e.target.id==='importFile'){importData(e.target.files?.[0]);e.target.value=''}});
document.addEventListener('dragstart',e=>{const row=e.target.closest('.lesson-row[data-resource]');if(!row)return;dragging={id:row.dataset.resource,folder:row.dataset.folder};row.classList.add('dragging');if(e.dataTransfer)e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragend',()=>{dragging=null;document.querySelectorAll('.dragging,.dropmark').forEach(x=>x.classList.remove('dragging','dropmark'))});
document.addEventListener('dragover',e=>{const row=e.target.closest('.lesson-row[data-resource]');if(!row||!dragging||row.dataset.folder!==dragging.folder)return;e.preventDefault();row.classList.add('dropmark')});
document.addEventListener('dragleave',e=>{e.target.closest('.lesson-row[data-resource]')?.classList.remove('dropmark')});
document.addEventListener('drop',e=>{const row=e.target.closest('.lesson-row[data-resource]');if(!row||!dragging||row.dataset.folder!==dragging.folder)return;e.preventDefault();const x=itemContext(dragging.id);if(!x)return;const a=x.f.resources,from=a.findIndex(v=>v.id===dragging.id),to=a.findIndex(v=>v.id===row.dataset.resource);if(from>=0&&to>=0&&from!==to){a.splice(to,0,a.splice(from,1)[0]);updated('Video order updated')}dragging=null})}
events();render();
if('serviceWorker' in navigator && window.isSecureContext){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(err=>console.warn('Offline cache unavailable:',err));});}
})();
</script></body></html>
